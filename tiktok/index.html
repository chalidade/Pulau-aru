<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hubungkan TikTok · Pulau Aru</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Rethink+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../src/style.css">
<style>
body{overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px;background:var(--ink)}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-size:30px;margin:0;text-wrap:balance}
p,li{line-height:1.6;color:var(--sand-dim)}
ol{padding-left:20px;margin:0}
code{background:var(--ink-2);padding:2px 6px;border-radius:3px;color:var(--sand);overflow-wrap:anywhere}
.box{background:var(--ink-2);border:2px solid var(--ink-3);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.codeout{font-family:ui-monospace,monospace;font-size:13px;background:var(--ink);padding:10px;border-radius:4px;overflow-wrap:anywhere;color:var(--lamp)}
a{color:var(--lamp)}
</style>
</head>
<body>
<main id="app">
  <div class="eyebrow">Khusus kreator</div>
  <h1>Hubungkan TikTok ke pulau</h1>
  <p>Setelah terhubung, jumlah follower diambil otomatis tiap jam dan langsung menjadi jumlah penduduk pulau.</p>
  <div class="box">
    <div class="field"><label for="ck">Client key app TikTok</label><input id="ck" class="inp" autocomplete="off" placeholder="aw1b2c3…"></div>
    <button class="btn" id="go">Login dengan TikTok</button>
  </div>
  <p>Redirect URI yang harus didaftarkan di app TikTok: <code id="ru"></code></p>
</main>
<script>
const REDIRECT = new URL('callback.html', location.href).href.split('?')[0];
document.getElementById('ru').textContent = REDIRECT;
const ck = document.getElementById('ck');
try { ck.value = localStorage.getItem('pulau-aru-tt-key') || ''; } catch (e) {}
document.getElementById('go').onclick = () => {
  const key = ck.value.trim(); if (!key) { ck.focus(); return; }
  const state = crypto.getRandomValues(new Uint32Array(4)).join('-');
  try { localStorage.setItem('pulau-aru-tt-key', key); sessionStorage.setItem('pulau-aru-tt-state', state); } catch (e) {}
  const u = new URL('https://www.tiktok.com/v2/auth/authorize/');
  u.search = new URLSearchParams({ client_key: key, scope: 'user.info.basic,user.info.stats', response_type: 'code', redirect_uri: REDIRECT, state }).toString();
  location.href = u.href;
};
</script>
</body>
</html>
