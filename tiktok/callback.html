<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kode TikTok · Pulau Aru</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Rethink+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../src/style.css">
<style>
body{overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px;background:var(--ink)}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-size:30px;margin:0;text-wrap:balance}
p,li{line-height:1.6;color:var(--sand-dim)}
ol{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px}
.box{background:var(--ink-2);border:2px solid var(--ink-3);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.codeout{font-family:ui-monospace,monospace;font-size:13px;background:var(--ink);padding:10px;border-radius:4px;overflow-wrap:anywhere;color:var(--lamp);user-select:all}
a{color:var(--lamp)}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Khusus kreator</div>
  <h1 id="t">Hampir selesai</h1>
  <div id="body"></div>
</main>
<script>
const q = new URLSearchParams(location.search), body = document.getElementById('body');
let expected = null; try { expected = sessionStorage.getItem('pulau-aru-tt-state'); } catch (e) {}
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
if (q.get('error')) {
  document.getElementById('t').textContent = 'TikTok menolak login';
  body.append(el('p', null, (q.get('error_description') || q.get('error')) + '. Kembali ke halaman sebelumnya dan coba lagi.'));
} else if (!q.get('code')) {
  document.getElementById('t').textContent = 'Tidak ada kode';
  body.append(el('p', null, 'Halaman ini dibuka langsung tanpa login TikTok. Mulai dari halaman Hubungkan TikTok.'));
} else if (expected && q.get('state') !== expected) {
  document.getElementById('t').textContent = 'Login tidak cocok';
  body.append(el('p', null, 'Kode ini bukan dari login yang kamu mulai di perangkat ini. Ulangi dari halaman Hubungkan TikTok.'));
} else {
  const code = q.get('code');
  const box = el('div', 'box');
  box.append(el('div', 'eyebrow', 'Kode sekali pakai'), el('div', 'codeout', code));
  const btn = el('button', 'btn', 'Salin kode');
  btn.onclick = async () => { try { await navigator.clipboard.writeText(code); btn.textContent = 'Tersalin'; } catch (e) { btn.textContent = 'Pilih teks di atas lalu salin'; } };
  box.append(btn); body.append(box);
  const ol = el('ol');
  const li1 = el('li'); li1.append('Buka ', Object.assign(el('a', null, 'workflow "TikTok: hubungkan akun"'), { href: 'https://github.com/chalidade/Pulau-aru/actions/workflows/tiktok-connect.yml', target: '_blank', rel: 'noopener' }), '.');
  ol.append(li1, el('li', null, 'Klik "Run workflow", tempel kode di kolom, lalu jalankan.'), el('li', null, 'Lakukan dalam beberapa menit, karena kodenya cepat kedaluwarsa. Setelah hijau, follower tersinkron tiap 15 menit.'));
  body.append(ol);
  history.replaceState(null, '', location.pathname);
}
</script>
</body>
</html>
