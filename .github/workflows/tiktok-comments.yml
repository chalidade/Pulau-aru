name: "TikTok: ambil komentar terbaru"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: island-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil komentar lewat Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/tiktok-comments.mjs
      - name: Simpan
        run: |
          git config user.name "Aru"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/comments.json studio/avatars 2>/dev/null || git add studio/comments.json
          git commit -m "Komentar TikTok terbaru" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done
