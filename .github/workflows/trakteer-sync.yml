name: "Trakteer: dermawan & request"
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: island-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil dukungan Trakteer
        id: tk
        env:
          TRAKTEER_API_KEY: ${{ secrets.TRAKTEER_API_KEY }}
        run: node scripts/trakteer-sync.mjs
      - name: Simpan
        if: steps.tk.outputs.changed == 'true'
        run: |
          git config user.name "Aru"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/island.json studio/traktir.json 2>/dev/null || git add data/island.json
          git commit -m "Trakteer: dermawan dan request baru" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done
